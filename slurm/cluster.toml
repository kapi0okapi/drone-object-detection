# Slurm cluster settings and job definitions, rendered by slurm/generate.py.
# Put your account in slurm/cluster.local.toml (not committed):  [cluster]  account = "..."
# Downloads (VisDrone, model weights) run on a login node: scripts/download_data.sh, scripts/download_models.sh.
# Find your Slurm account with:  sacctmgr show assoc format=Account%20,User,QOS | grep $USER

[cluster]
account = "CHANGE_ME"   # overridden by slurm/cluster.local.toml
python_module = "Python/3.11.3-GCCcore-12.3.0"   # module spider Python
venv = "/cluster/work/$USER/venvs/drone-object-detection"
workdir = "/cluster/work/$USER/drone-object-detection"   # $DATA = workdir/data, $RUNS = workdir/runs
mail_user = ""

[cluster.env]
YOLO_OFFLINE = "1"      # weights are pre-fetched by scripts/download_models.sh

[defaults]
partition = "GPUQ"
time = "0-04:00:00"
cpus = 8
mem = "32G"
gpus = 1
constraint = "gpu32g|gpu40g|gpu80g"   # V100 32 GB, A100, H100 (setup_cluster.sh installs PyTorch for CUDA 12.6)

[jobs.slice]
description = "Cut train and val into 640 px tiles with 20 % overlap (CPU)"
partition = "CPUQ"
gpus = 0
constraint = ""
cpus = 2
mem = "8G"
time = "0-01:00:00"
command = "python -m aerial.tiling --data $DATA/visdrone --tile 640 --overlap 0.2"

[jobs.train]
description = "YOLO26s from COCO: whole images at 640 and 1280 px, and 640 px tiles (array)"
time = "0-16:00:00"
cpus = 16
mem = "64G"
checkpoint_signal = true
command = "python -m aerial.train --model yolo26s.pt --epochs 100 --lr0 0.001 --workers 14 $ARRAY_ARGS"
array = [
    "--data $DATA/visdrone/visdrone.yaml --imgsz 640 --batch 32 --name visdrone_640",
    "--data $DATA/visdrone/visdrone.yaml --imgsz 1280 --batch 8 --name visdrone_1280",
    "--data $DATA/visdrone/tiles640.yaml --imgsz 640 --batch 32 --epochs 40 --name visdrone_tiles640",
]

[jobs.evaluate]
description = "test-dev, 1610 images: which helps small objects, more pixels in training or at inference? (array)"
time = "0-02:00:00"
command = "python -m aerial.evaluate --data $DATA/visdrone --split test $ARRAY_ARGS"
array = [
    "--model $RUNS/visdrone_640/weights/best.pt --imgsz 640",
    "--model $RUNS/visdrone_1280/weights/best.pt --imgsz 1280",
    "--model $RUNS/visdrone_640/weights/best.pt --tiled",
    "--model $RUNS/visdrone_tiles640/weights/best.pt --tiled",
    "--model $RUNS/visdrone_tiles640/weights/best.pt --tiled --full-image",
]
